<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Car Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="container">
    <header>
      <h1>Book a Car</h1>
    </header>
    <main>
      <section id="form">
        <h2>Contact Us</h2>

        <form action="process.html" method="get" id="booking">
          <div class="form-row">
            <label for="contactname">Name</label>
            <input type="text" name="contactname" id="contactname" autofocus required
              pattern="[A-Z][a-z]+( [A-Z][a-z]+)*"
              title="Please enter a valid name. Each name must start with a capital letter followed by lowercase letters.">
          </div>

          <div class="form-row">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" required
              pattern="[a-z A-Z 0-9 ._%+-]+@[a-z A-Z 0-9 .-]+\.[a-z A-Z]{2,}"
              title="Please enter a valid email address, e.g. name@example.com.">
          </div>

          <fieldset class="check">
            <legend>Do you have a Driver's Licence?</legend>

            <label for="yes">
              <input type="radio" name="licence" value="Yes" id="yes">
              Yes</label>

            <label for="no">
              <input type="radio" name="licence" value="No" id="no">
              No</label>
          </fieldset>

          <div class="form-row">
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="17" max="80" required
              title="Please enter an age between 17 and 80.">
          </div>

          <div class="form-row">
            <label for="date">Booking Date</label>
            <input type="date" name="date" id="date" required
            title="Please select an event date.">
          </div>

          <div class="form-row">
            <label for="car">Car</label>
            <select name="car" id="car">
              <option>Ford Focus</option>
              <option>Hyundai Tucson</option>
              <option>Toyota Rav4</option>
              <option>Renault Kadjar</option>
              <option>Nissan Qashqai</option>
            </select>
          </div>

          <p>
            Please provide any other details you think will be useful
            to us in the text area below (it may save us calling or
            emailing you, and help avoid delays).
          </p>

          <div class="form-row">
            <label for="details">
              More details (as much as you think we'll need!)
            </label>
            <textarea name="details" id="details"></textarea>
          </div>

          <button type="submit">Send Us the Info</button>
          <button type="reset">Clear the Info</button>

        </form>
      </section>
      <section id="image">
        <figure>
          <img src="images/car.jfif" alt="Car" class="ui fluid image">
          <figcaption>Car Rental</figcaption>
        </figure>
      </section>
    </main>
  </div>
</body>

</html>
